name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  demo-determinism:
    name: Demo output is deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate demo snapshot
        run: bun run demo:write

      - name: Fail if demo bytes drifted
        run: git diff --exit-code examples/demo-output.txt

  node-install:
    name: npm install + Node runtime probe
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (runs prepare -> tsc)
        run: npm install --no-fund --no-audit

      - name: Import and run from dist/ under Node
        run: |
          node --input-type=module -e "
          import('./dist/index.js').then(async (m) => {
            const { Journal, PaymentSplitter } = m;
            const j = new Journal('probe.journal.jsonl');
            const s = new PaymentSplitter(j, () => 1700000000000);
            const e = s.createEscrow({ taskId: 'ci-probe', payer: 'p', total: 901, contributors: ['a', 'b', 'c'], policy: { kind: 'equal' } });
            for (const id of ['a', 'b', 'c']) s.confirm(e.id, id);
            const payouts = s.release(e.id);
            const sum = payouts.reduce((acc, p) => acc + p.units, 0);
            if (sum !== 901) throw new Error('payout sum ' + sum + ' != 901');
            console.log('node probe OK:', e.id, sum, 'units');
          }).catch((err) => { console.error('node probe failed', err); process.exit(1); });
          "
